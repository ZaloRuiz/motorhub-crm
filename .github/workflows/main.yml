name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main # Cambia a master si tu rama principal se llama así

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build -- --configuration=production --base-href /${{ github.event.repository.name }}/

      - name: Deploy to GH Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/${{ github.event.repository.name }}/browser # Verifica si tu Angular compila aquí (versiones 17+)
          branch: gh-pages
