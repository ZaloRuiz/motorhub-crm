
<section class="dashboard-card">
  <div class="card-header">
    <div class="card-heading">
      <h3>Nuevos prospectos</h3>
      <p>Evolución de la captación comercial</p>
    </div>

    <span class="card-badge">Últimos 30 días</span>
  </div>

  <div class="chart-container">
    <apx-chart
      [series]="chartSeries"
      [chart]="chartDetails"
      [stroke]="chartStroke"
      [xaxis]="chartXAxis"
      [yaxis]="chartYAxis"
      [markers]="chartMarkers"
      [fill]="chartFill"
      [grid]="chartGrid"
      [dataLabels]="chartDataLabels"
      [tooltip]="chartTooltip">
    </apx-chart>
  </div>
</section>
