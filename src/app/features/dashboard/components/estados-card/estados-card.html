
<section class="dashboard-card">
  <div class="card-header">
    <div class="card-heading">
      <h3>Prospectos por estado</h3>
      <p>Distribución según la etapa comercial</p>
    </div>

    <span class="card-badge">Prospectos</span>
  </div>

  <div class="chart-container">
    <apx-chart
      [series]="chartSeries"
      [chart]="chartDetails"
      [xaxis]="chartXAxis"
      [yaxis]="chartYAxis"
      [plotOptions]="chartPlotOptions">
    </apx-chart>
  </div>
</section>
